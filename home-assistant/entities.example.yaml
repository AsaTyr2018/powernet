# Home Assistant entity IDs.

pv_total: sensor.your_inverter_pv_total_power
pv_string_1: sensor.your_inverter_pv1_power
pv_string_2: sensor.your_inverter_pv2_power
pv_string_3: sensor.your_inverter_pv3_power

load_power: sensor.your_home_load_power
grid_import: sensor.your_grid_import_power
grid_export: sensor.your_grid_export_power

battery_charge: sensor.your_battery_charge_power
battery_discharge: sensor.your_battery_discharge_power
