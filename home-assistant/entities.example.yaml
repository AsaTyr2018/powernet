grid_import_energy_today: sensor.your_grid_import_energy_today
grid_export_energy_today: sensor.your_grid_export_energy_today
battery_charge_energy_today: sensor.your_battery_charge_energy_today
battery_discharge_energy_today: sensor.your_battery_discharge_energy_today

spot_price_now: sensor.your_spot_price_now
spot_price_next: sensor.your_spot_price_next
spot_price_low: sensor.your_spot_price_low_today
spot_price_high: sensor.your_spot_price_high_today
monthly_grid_cost: sensor.your_monthly_grid_cost

solar_forecast_now: sensor.your_solar_forecast_power_now
solar_forecast_current_hour: sensor.your_solar_forecast_current_hour
solar_forecast_next_hour: sensor.your_solar_forecast_next_hour
solar_forecast_today: sensor.your_solar_forecast_today
